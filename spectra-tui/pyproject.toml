[project]
name = "spectra-tui"
version = "0.1.0"
description = "Terminal User Interface for Spectra AI Trading Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.47.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.scripts]
spectra = "spectra_tui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spectra_tui"]
